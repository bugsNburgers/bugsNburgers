name: Update profile stats

on:
  schedule:
    - cron: "0 4 */3 * *"   # every 3 days at 04:00 UTC
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run profile updater
        run: python update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Open or update stats pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/profile-stats
          base: main
          delete-branch: true
          add-paths: |
            dark_mode.svg
            light_mode.svg
          commit-message: "chore: refresh profile stats"
          title: "chore: refresh profile stats"
          body: |
            Refresh the profile's LOC, contributions, repositories, stars, followers,
            and last-checked timestamp from GitHub.

            Review and merge this PR to publish the refreshed stats on the profile.
            The updater runs every three days and updates this PR if it is still open.
